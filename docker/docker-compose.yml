services:
  nginx:
    image: docker_nginx:latest
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: spec-agent-nginx
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${SPEC_AGENT_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - spec-agent

  backend:
    image: docker_backend:latest
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: spec-agent-backend
    environment:
      APP_ENV: docker
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123456}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_EXPIRE_HOURS: ${AUTH_TOKEN_EXPIRE_HOURS:-12}
      MONGODB_HOST: ${MONGODB_HOST:-127.0.0.1}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-password123}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-spec_agent}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-127.0.0.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-spec_agent}
      NMR_SERVER_BASE_URL: ${NMR_SERVER_BASE_URL:-http://127.0.0.1:8080}
      LCMS_INFER_URL: ${LCMS_INFER_URL:-http://127.0.0.1:9999/infer}
      LCMS_MSCONVERT_MODE: ${LCMS_MSCONVERT_MODE:-auto}
      LCMS_MSCONVERT_PATH: ${LCMS_MSCONVERT_PATH:-}
      LCMS_MSCONVERT_DOCKER_BIN: ${LCMS_MSCONVERT_DOCKER_BIN:-docker}
      LCMS_MSCONVERT_DOCKER_IMAGE: ${LCMS_MSCONVERT_DOCKER_IMAGE:-proteowizard/pwiz-skyline-i-agree-to-the-vendor-licenses}
      LCMS_MSCONVERT_SHARED_ROOT: ${LCMS_MSCONVERT_SHARED_ROOT:-}
      RAMAN_CAPTURE_INSTRUMENT_IP: ${RAMAN_CAPTURE_INSTRUMENT_IP:-127.0.0.1}
      RAMAN_CAPTURE_CALLBACK_URL: ${RAMAN_CAPTURE_CALLBACK_URL:-http://127.0.0.1:8099/raman/jy/callback}
      RAMAN_CAPTURE_SUBMIT_PORT: ${RAMAN_CAPTURE_SUBMIT_PORT:-7001}
      RAMAN_CAPTURE_RESULT_PORT: ${RAMAN_CAPTURE_RESULT_PORT:-7002}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.agicto.cn/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      SPEC_AGENT_RUNTIME_ROOT: /app/.runtime
      SPEC_AGENT_UPLOAD_ROOT: /app/.runtime/uploads
      SPEC_AGENT_OUTPUT_ROOT: /app/.runtime/outputs
      SPEC_AGENT_LOG_ROOT: /app/backend/logs
      SPECTRUM_FILES_ROOT: ${SPECTRUM_FILES_ROOT:-/data/spectrum_files}
    volumes:
      - ../.runtime:/app/.runtime
      - ../backend/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - spec-agent

  worker:
    image: docker_worker:latest
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: spec-agent-worker
    command:
      - /bin/sh
      - -lc
      - python -m celery -A app.worker.celery_app:celery_app worker --loglevel=info -Q ${CELERY_TASK_QUEUE:-spec_agent}
    environment:
      APP_ENV: docker
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123456}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_EXPIRE_HOURS: ${AUTH_TOKEN_EXPIRE_HOURS:-12}
      MONGODB_HOST: ${MONGODB_HOST:-127.0.0.1}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-password123}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-spec_agent}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-127.0.0.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-spec_agent}
      NMR_SERVER_BASE_URL: ${NMR_SERVER_BASE_URL:-http://127.0.0.1:8080}
      LCMS_INFER_URL: ${LCMS_INFER_URL:-http://127.0.0.1:9999/infer}
      RAMAN_CAPTURE_INSTRUMENT_IP: ${RAMAN_CAPTURE_INSTRUMENT_IP:-127.0.0.1}
      RAMAN_CAPTURE_CALLBACK_URL: ${RAMAN_CAPTURE_CALLBACK_URL:-http://127.0.0.1:8099/raman/jy/callback}
      RAMAN_CAPTURE_SUBMIT_PORT: ${RAMAN_CAPTURE_SUBMIT_PORT:-7001}
      RAMAN_CAPTURE_RESULT_PORT: ${RAMAN_CAPTURE_RESULT_PORT:-7002}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.agicto.cn/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      SPEC_AGENT_RUNTIME_ROOT: /app/.runtime
      SPEC_AGENT_UPLOAD_ROOT: /app/.runtime/uploads
      SPEC_AGENT_OUTPUT_ROOT: /app/.runtime/outputs
      SPEC_AGENT_LOG_ROOT: /app/backend/logs
      SPECTRUM_FILES_ROOT: ${SPECTRUM_FILES_ROOT:-/data/spectrum_files}
    volumes:
      - ../.runtime:/app/.runtime
      - ../backend/logs:/app/backend/logs
    restart: unless-stopped
    networks:
      - spec-agent

networks:
  spec-agent:

samples:
  nmr:
    execution_mode: local
    dirs:
      - E:/spectrum_files/acceptance/nmr
  gpc:
    execution_mode: local
    dirs:
      - E:/spectrum_files/acceptance/gpc
    patterns:
      - "*.arw"
  ir:
    execution_mode: local
    dirs:
      - E:/spectrum_files/acceptance/ir
    patterns:
      - "*.txt"
      - "*.csv"

